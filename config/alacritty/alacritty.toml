[font]
size = 19
glyph_offset = { x = 0, y = 0 }
offset = { x = 0, y = 0 }

[font.normal]
family = "Lambda"
style = "Regular"

[font.bold]
family = "Lambda"
style = "Bold"

[font.bold_italic]
family = "Lambda"
style = "Bold Italic"

[font.italic]
family = "Lambda"
style = "Italic"

[window]
# opacity = 0.8
dynamic_padding = true
padding = {x = 2, y = 0}
decorations = "None"
option_as_alt = "OnlyLeft"

[mouse]
hide_when_typing = true

[cursor]
style = { shape ="Block", blinking = "Never" }

[keyboard]
bindings = [
  { key = "q", mode = "Vi", action = "ToggleViMode" },
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" },
]

[colors.primary]
background = "#303841"
foreground = "#F8F8F2"

[colors]
cursor = { cursor = '#a6e22e' }

[colors.normal]
black = "#000000"
red = "#ec5f66"
green = "#99c794"
yellow = "#E6DB74"
blue = "#6699cc"
cyan = "#A1EFE4"
magenta = "#9a6a9a"
white = "#ffffff"

[colors.bright]
yellow = "#ccad52"
